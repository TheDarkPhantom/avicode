<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Resolves both appearance axes before first paint: the light/dark mode
      // ("t3code:theme") and the Avi Code colour palette ("t3code:color-theme").
      // Keep CHROME in sync with COLOR_THEMES in src/lib/colorTheme.ts and the
      // palettes in src/styles/colorThemes.css — colorTheme.test.ts asserts it.
      (() => {
        const DEFAULT_COLOR_THEME = "oxblood";
        const CHROME = {
          oxblood: { light: "#fcfcfc", dark: "#0b0808" },
          midnight: { light: "#f7f8fa", dark: "#080b12" },
          forest: { light: "#f6f8f6", dark: "#070b09" },
          violet: { light: "#f9f8fc", dark: "#09070f" },
          graphite: { light: "#fafafa", dark: "#09090b" },
        };
        // The media-less tag is the one that applies in every mode; the two
        // media-scoped tags above are static fallbacks for a failed boot.
        const themeColorMeta = document.querySelector('meta[name="theme-color"]:not([media])');
        const paint = (chromeColor, isDark) => {
          const root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.backgroundColor = chromeColor;
          // Consumed by the boot-shell styles below, which would otherwise
          // paint the body over the html background.
          root.style.setProperty("--boot-background", chromeColor);
          themeColorMeta?.setAttribute("content", chromeColor);
        };
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);

          const storedColorTheme = window.localStorage.getItem("t3code:color-theme");
          const colorTheme = Object.hasOwn(CHROME, storedColorTheme)
            ? storedColorTheme
            : DEFAULT_COLOR_THEME;
          // The default palette deliberately sets no attribute so that none of
          // the override rules in colorThemes.css match.
          if (colorTheme === DEFAULT_COLOR_THEME) {
            document.documentElement.removeAttribute("data-color-theme");
          } else {
            document.documentElement.setAttribute("data-color-theme", colorTheme);
          }

          paint(CHROME[colorTheme][isDark ? "dark" : "light"], isDark);
        } catch {
          paint(CHROME[DEFAULT_COLOR_THEME].dark, true);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      /* --boot-background is set by the pre-paint script above from the
         selected colour theme; the literals are the oxblood fallback for when
         that script threw or localStorage was unreadable. */
      body {
        background: var(--boot-background, #fcfcfc);
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: var(--boot-background, #0b0808);
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <!-- No release-stage suffix here: the stage is resolved at runtime in
         branding.ts and applied by DocumentTitleSync, so hardcoding one made
         Nightly and Dev builds read "(Alpha)" until hydration. -->
    <title>Avi Code</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Avi Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Avi Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
