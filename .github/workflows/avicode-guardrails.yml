name: AviCode Guardrails

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# Avi Code addition: see ci.yml. `AviCode boundaries` is a required check, so it
# must report on the merge queue's temporary branch too. `desktop-smoke` and
# `windows-package` gate on `github.head_ref`, which is empty for merge_group, so
# they skip inside the queue — a skipped required check counts as satisfied, and
# they already ran on the pull request itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boundaries:
    name: AviCode boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify customization boundaries
        run: |
          node --test scripts/avicode/check-upstream-guardrails.node-test.mjs
          node scripts/avicode/check-upstream-guardrails.mjs

  desktop-smoke:
    name: AviCode desktop smoke
    if: startsWith(github.head_ref, 'chore/upstream-sync-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop bundles
        run: vp run build:desktop

      - name: Run desktop smoke test
        run: timeout 45s xvfb-run -a vp run test:desktop-smoke

  windows-package:
    name: AviCode Windows x64 package
    if: startsWith(github.head_ref, 'chore/upstream-sync-') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # Packaging compiles `native/resource-monitor`, so this job needs cargo.
      # The runner image ships Rust, but pin it explicitly the way release.yml
      # does — an image change should not silently break packaging.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build desktop bundles
        run: vp run build:desktop

      # A pull request only proves packaging still works, so it keeps the
      # throwaway CI version. A manual dispatch is someone asking for an
      # installer they intend to run, so that one carries the real version.
      - name: Build unsigned personal-alpha package
        shell: pwsh
        run: |
          $buildArgs = @("--platform", "win", "--target", "nsis", "--arch", "x64", "--skip-build")
          if ($env:GITHUB_EVENT_NAME -ne "workflow_dispatch") {
            $buildArgs += @("--build-version", "0.0.0-avicode-ci")
          }
          vp run dist:desktop:artifact @buildArgs

      - name: Verify package exists
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($artifacts.Count -eq 0) {
            throw "The Windows x64 packaging check produced no installer."
          }
          $artifacts | Select-Object Name, Length

      # Only on a manual dispatch: PR runs are a check, and uploading a
      # multi-hundred-megabyte installer for every one of them is waste.
      - name: Upload installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: avicode-windows-x64-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14
