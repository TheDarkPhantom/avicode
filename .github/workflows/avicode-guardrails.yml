name: Avi Code guardrails

# Fails when an upstream sync drops Avi Code 2's identity, branding, release or privacy changes.
# The protected values live in .avicode/upstream-guardrails.json.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avicode-guardrails-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boundaries:
    name: AviCode boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      - name: Test the checker
        run: node --test scripts/avicode/check-upstream-guardrails.node-test.mjs

      - name: Check Avi Code boundaries
        run: node scripts/avicode/check-upstream-guardrails.mjs
